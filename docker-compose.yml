services:
  redis:
    image: redis:7-alpine
    container_name: mitra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local Postgres is already running on 5432, so this container is opt-in
  # and exposed on 5433 to avoid a port clash.
  #
  # The password is NEVER stored in this file. Provide it through the
  # environment (compose also reads a gitignored .env next to this file):
  #   export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
  #   docker compose --profile db up -d
  # then set in backend/.env:
  #   DATABASE_URL=postgresql://postgres:<POSTGRES_PASSWORD>@localhost:5433/mitra_maheshwari
  postgres:
    image: postgres:16-alpine
    container_name: mitra-postgres
    profiles: ["db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a generated secret}"
      POSTGRES_DB: mitra_maheshwari
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mitra_maheshwari"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
